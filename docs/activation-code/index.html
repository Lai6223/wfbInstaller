<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>五位数字激活码生成器</title><style>body{font:18px system-ui;max-width:660px;margin:60px auto;padding:24px}input,button,output{font:inherit;padding:14px;box-sizing:border-box;width:100%;margin:12px 0}output{display:block;font-size:36px;letter-spacing:8px}</style><h1>五位数字激活码生成器</h1><p>仅作者自己保管。输入手表显示的四位 ID，不要输入前面的 ID 字样。激活码中的开头 0 也需要输入。</p><input id="uid" maxlength="4" placeholder="例如 1234 或 A12B"><button id="generate">生成激活码</button><output id="output"></output><p>123 是结束试用的测试号，不是激活码。四位 ID 可能重复，重复 ID 会生成同一个激活码。</p><script>
const secretHex="d92d0c9d42583f3a2e1bd7113edd82db6dd1702cb645daced79db545c0ec6e94";
async function generateCode(id){const key=await crypto.subtle.importKey('raw',Uint8Array.from(secretHex.match(/../g),x=>parseInt(x,16)),{name:'HMAC',hash:'SHA-256'},false,['sign']);const d=new Uint8Array(await crypto.subtle.sign('HMAC',key,new TextEncoder().encode('37f311a61b794153b629ff40913d1566|numeric5|'+id)));let n=0;for(let i=0;i<4;i++)n=(n*256+d[i])%100000;return String(n).padStart(5,'0');}
document.querySelector('#generate').onclick=async()=>{let id=document.querySelector('#uid').value.trim().toUpperCase();const out=document.querySelector('#output');if(!/^[A-Z0-9]{4}$/.test(id)){out.textContent='请输入四位ID';return;}try{out.textContent=await generateCode(id);}catch(e){out.textContent='请用Chrome或Edge打开';}};
</script></html>
