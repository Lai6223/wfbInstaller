<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf3ef"><title>激活码生成器</title>
<style>
:root{color-scheme:light;--green:#16634b;--ink:#203b31;--muted:#74847b}*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(100%,480px);margin:auto;padding:32px 20px max(28px,env(safe-area-inset-bottom))}.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}.logo{display:grid;place-items:center;width:34px;height:34px;background:var(--green);color:#fff;border-radius:11px}header{padding:14px 4px 27px}h1{font-size:30px;line-height:1.3;letter-spacing:-1px;margin:27px 0 10px}header p{font-size:14px;color:var(--muted);margin:0}.card{background:white;border:1px solid #dee8e0;border-radius:24px;padding:24px;box-shadow:0 12px 36px #1d473209}.step{font-size:11px;font-weight:700;color:var(--green);letter-spacing:2px;margin:0 0 15px}label{display:block;font-weight:600;margin:0 0 7px}.help{font-size:12px;color:var(--muted);margin:0 0 18px}.field{display:flex;align-items:center;border:1px solid #c9d8cd;border-radius:14px;background:#fafcf9;padding:0 14px;gap:12px}.field:focus-within{border-color:var(--green);box-shadow:0 0 0 3px #16634b15}.prefix{color:#81958a;font:18px monospace}input{width:100%;min-width:0;background:transparent;border:0;outline:0;font:30px/1.2 ui-monospace,Consolas,monospace;letter-spacing:7px;color:var(--ink);padding:18px 0;text-transform:uppercase}input::placeholder{font-size:23px;letter-spacing:4px;color:#bdc9c0}button{font:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:3px solid #94b8a2;outline-offset:3px}.clear{flex-shrink:0;width:44px;height:44px;border:0;background:transparent;color:#7e9186;font-size:24px}.error{min-height:24px;font-size:12px;color:#b34239;margin:7px 0 13px}.primary,.copy{width:100%;min-height:54px;border:0;border-radius:13px;background:var(--green);color:white;font-weight:600}.primary:active,.copy:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:default}.result{margin-top:22px;border-radius:20px;background:#f1f6f0;padding:22px 18px;text-align:center}.result-head{display:flex;align-items:center;justify-content:space-between;color:#71877a;font-size:12px}.state{font-size:11px;background:#e4ece2;border-radius:20px;padding:3px 9px}output{display:block;font:48px/1.4 ui-monospace,Consolas,monospace;letter-spacing:8px;padding-left:8px;color:#b0c4b3;margin:21px 0 7px;user-select:all;overflow-wrap:anywhere}output.ready{color:var(--green)}.caption{font-size:12px;color:var(--muted);margin:0 0 20px;min-height:20px}.copy{background:white;color:var(--green);border:1px solid #bfd1c2}.note{font-size:12px;color:#7b8d80;text-align:center;margin:19px 0 0}.tips{padding:22px 8px;color:#78897d;font-size:12px}.tips p{margin:0 0 8px}.tips strong{font-weight:600;color:#546e5d}.toast{position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#203b31;color:#fff;border-radius:12px;padding:12px 20px;box-shadow:0 8px 30px #0002;font-size:14px;white-space:nowrap;opacity:0;pointer-events:none}.toast.show{opacity:1}@media(max-width:350px){main{padding:20px 12px}.card{padding:18px}h1{font-size:27px}output{font-size:42px}}
</style></head><body><main><header><div class="brand"><span class="logo" aria-hidden="true">✳</span>专属激活工具</div><h1>输入 ID，即刻生成。</h1><p>五位数字激活码，一键生成与复制。</p></header><section class="card" aria-label="激活码生成器"><p class="step">01 / 设备信息</p><form id="form"><label for="uid">四位设备 ID</label><p class="help">在手表上查看 ID，支持数字和英文字母。</p><div class="field"><span class="prefix" aria-hidden="true">ID</span><input id="uid" placeholder="A12B" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-describedby="error"><button class="clear" id="clear" type="button" aria-label="清空输入">×</button></div><p class="error" id="error" role="alert"></p><button class="primary" id="generate" type="submit">生成激活码 →</button></form><div class="result"><div class="result-head"><span>02 / 专属激活码</span><span class="state" id="state">等待生成</span></div><output id="output" aria-live="polite" aria-label="五位数字激活码">·····</output><p class="caption" id="caption">生成后，填写到表盘设置中</p><button class="copy" id="copy" disabled>复制激活码</button></div><p class="note">固定 5 位数字，开头的 0 也需要填写。</p></section><div class="tips"><p><strong>使用提示</strong> · 可直接粘贴 ID:1234，自动识别。</p><p>相同 ID 对应相同激活码。123 是结束试用的测试号，不是激活码。</p></div></main><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
'use strict';
const secretHex="d92d0c9d42583f3a2e1bd7113edd82db6dd1702cb645daced79db545c0ec6e94";
async function generateCode(id){const key=await crypto.subtle.importKey('raw',Uint8Array.from(secretHex.match(/../g),x=>parseInt(x,16)),{name:'HMAC',hash:'SHA-256'},false,['sign']);const d=new Uint8Array(await crypto.subtle.sign('HMAC',key,new TextEncoder().encode('37f311a61b794153b629ff40913d1566|numeric5|'+id)));let n=0;for(let i=0;i<4;i++)n=(n*256+d[i])%100000;return String(n).padStart(5,'0');}
const $=s=>document.querySelector(s);let code='',revision=0,timer;
function reset(){revision++;code='';$('#output').textContent='·····';$('#output').classList.remove('ready');$('#copy').disabled=true;$('#copy').textContent='复制激活码';$('#state').textContent='等待生成';$('#caption').textContent='生成后，填写到表盘设置中';$('#error').textContent='';$('#uid').removeAttribute('aria-invalid');$('#generate').disabled=false;}
function notify(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),2200);}
$('#uid').addEventListener('input',reset);$('#clear').onclick=()=>{$('#uid').value='';reset();$('#uid').focus();};
$('#form').onsubmit=async e=>{e.preventDefault();reset();const token=revision;const id=$('#uid').value.trim().toUpperCase().replace(/^ID\s*[:：]?\s*/,'');if(!/^[A-Z0-9]{4}$/.test(id)){$('#error').textContent='请输入 4 位数字或英文字母，例如 A12B。';$('#uid').setAttribute('aria-invalid','true');$('#uid').focus();return;}$('#uid').value=id;$('#uid').blur();$('#generate').disabled=true;$('#state').textContent='正在生成';try{const value=await generateCode(id);if(token!==revision)return;code=value;$('#output').textContent=code;$('#output').classList.add('ready');$('#copy').disabled=false;$('#state').textContent='已生成';$('#caption').textContent='对应设备 ID：'+id;}catch{if(token===revision){$('#error').textContent='生成失败，请用 Chrome、Edge 或 Safari 打开。';$('#state').textContent='生成失败';}}finally{if(token===revision)$('#generate').disabled=false;}};
$('#copy').onclick=async()=>{if(!code)return;const value=code;try{await navigator.clipboard.writeText(value);notify('激活码已复制');}catch{const t=document.createElement('textarea');t.value=value;t.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';t.readOnly=true;document.body.append(t);t.select();t.setSelectionRange(0,value.length);let ok=false;try{ok=document.execCommand('copy');}catch{}t.remove();notify(ok?'激活码已复制':'请长按激活码，选择复制');}};
</script></body></html>
